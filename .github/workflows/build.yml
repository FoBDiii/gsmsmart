name: Compilar apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  android:
    name: APK de Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Copiar la app al proyecto Android
        run: npx cap sync android
      - name: Compilar APK firmado
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          GSM_VERSION_CODE: ${{ github.run_number }}
          GSM_VERSION_NAME: ${{ env.VERSION }}
          GSM_STORE_PASSWORD: ${{ secrets.GSM_STORE_PASSWORD }}
          GSM_KEY_PASSWORD: ${{ secrets.GSM_KEY_PASSWORD }}
      - run: cp android/app/build/outputs/apk/release/app-release.apk "GSMsmart-${VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: GSMsmart-*.apk

  windows:
    name: Programa de Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Poner número de versión
        run: npm version ${{ env.VERSION }} --no-git-tag-version --allow-same-version
      - name: Compilar instalador y versión portable
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  release:
    name: Publicar descarga
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: GSMsmart ${{ env.VERSION }}
          make_latest: true
          files: out/*
          body: |
            **Android:** descarga `GSMsmart-${{ env.VERSION }}.apk` en el móvil y ábrelo para instalar.
            **Windows:** descarga `GSMsmart-Instalador-${{ env.VERSION }}.exe` y ejecútalo. Si prefieres no instalar nada, usa `GSMsmart-Portable-${{ env.VERSION }}.exe`.
